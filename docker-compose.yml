name: eduvault

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduvault}
      POSTGRES_USER: ${POSTGRES_USER:-eduvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduvault123}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduvault}:${POSTGRES_PASSWORD:-eduvault123}@postgres:5432/${POSTGRES_DB:-eduvault}?connection_limit=20
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-with-at-least-32-characters}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_TTL_HOURS: ${AUTH_TTL_HOURS:-8}
      MIGRATION_MODE: ${MIGRATION_MODE:-deploy}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      PLATFORM_NAME: ${PLATFORM_NAME:-EduVault}
      PGBOSS_WORKER: "false"
      SEED_ON_START: ${SEED_ON_START:-false}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_INITIAL_NAME: ${ADMIN_INITIAL_NAME:-Administrador da Plataforma}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      RTMP_STREAM_KEY: ${RTMP_STREAM_KEY:-1111111111111111111111111111111111111111111111111111111111111111}
      LOOP_STREAM_KEY: ${LOOP_STREAM_KEY:-2222222222222222222222222222222222222222222222222222222222222222}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      GROQ_FALLBACK_MODEL: ${GROQ_FALLBACK_MODEL:-openai/gpt-oss-120b}
      GROQ_MODEL_SWITCH_AT: ${GROQ_MODEL_SWITCH_AT:-2026-07-17T00:00:00.000Z}
      GROQ_TIMEOUT_MS: ${GROQ_TIMEOUT_MS:-20000}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-1200}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-20}
      AI_RATE_LIMIT_WINDOW_MS: ${AI_RATE_LIMIT_WINDOW_MS:-900000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
      - "127.0.0.1:${RTMP_PORT:-1935}:1935"
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://127.0.0.1:8080/health/ready',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
  app_data:
